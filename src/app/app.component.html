<app-header></app-header>
<div class="container">
  <div class="row" >
    <div class="col-xs-6">
        <div (click)= "sClicked = true; rClicked = false" style="border: midnightblue; border-width:2px; background: lightskyblue">Shopping List</div>
    </div>
    <div class="col-xs-6">
      <div (click)= "sClicked = false; rClicked = true" style="border: midnightblue; border-width:2px; background: lightskyblue">Recipe List</div>
    </div>
  </div>
</div>
<div class="container">
  <div class="row">
    <div class="col-xs-6">
      <div *ngIf="sClicked"><app-shopping-list></app-shopping-list></div> 
      <div *ngIf="rClicked"><app-recipes></app-recipes></div> 
    </div>
  </div>
</div>
